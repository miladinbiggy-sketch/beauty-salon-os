# Beauty Salon OS — 服务器子路径部署（挂到已有 Caddy 站点的 /salon、/salon-admin、/salon-api）
# 与 infra/docker-compose.yml 的区别：不带 web 服务（前端静态文件由已有 Caddy 托管），
# app 容器额外接入中转站网络 tokyo_internal，让已有 Caddy 能按容器名反代。
# 用法（服务器 /opt/salon）：docker compose -f docker-compose.server.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-salon}
      TZ: Asia/Tokyo
    volumes:
      - salon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salon}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - salon-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./app
      dockerfile: infra/Dockerfile.app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
    command: ["npx", "tsx", "packages/database/src/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  seed:
    build:
      context: ./app
      dockerfile: infra/Dockerfile.app
    environment:
      NODE_ENV: production
      SEED_DEMO: ${SEED_DEMO:-false}
      DATABASE_URL: postgres://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
    command: ["sh", "-c", "if [ \"$SEED_DEMO\" = \"true\" ]; then npx tsx packages/database/src/seed.ts; else echo 'SEED_DEMO != true, skip'; fi"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  app:
    build:
      context: ./app
      dockerfile: infra/Dockerfile.app
    container_name: salon-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
      REDIS_URL: redis://redis:6379
      PARTNER_WEBHOOK_KEYS_JSON: "${PARTNER_WEBHOOK_KEYS_JSON:-}"
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      QUEUE_DRIVER: bullmq
      PORT: "8787"
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:?Configure a specific HTTPS origin}
      TRUST_PROXY: "true"
      RATE_LIMIT_DRIVER: redis
      SESSION_COOKIE_PATH: /salon-api
    networks:
      - default
      - relay
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8787/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  worker:
    build:
      context: ./app
      dockerfile: infra/Dockerfile.app
    restart: unless-stopped
    command: ["node", "apps/worker/dist/index.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-salon}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-salon}
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      LINE_CHANNEL_ACCESS_TOKEN: ${LINE_CHANNEL_ACCESS_TOKEN:-}
      WORKER_POLL_MS: "15000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

networks:
  relay:
    external: true
    name: tokyo_internal

volumes:
  salon-pgdata:
  salon-redis:
